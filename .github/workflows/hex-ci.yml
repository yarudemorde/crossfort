name: Hex game checks
on:
  push:
    paths: ['games/hex/**', '.github/workflows/hex-ci.yml', '.github/workflows/pages.yml']
  pull_request:
    paths: ['games/hex/**', '.github/workflows/hex-ci.yml', '.github/workflows/pages.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/hex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/hex/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
